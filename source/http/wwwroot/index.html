<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用户登录</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:"Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#eaf2ff,#f5f7fb 55%,#e8f8f4);color:#1f2937}
.card{width:100%;max-width:390px;padding:36px 32px;background:#fff;border:1px solid #e5eaf2;border-radius:18px;box-shadow:0 18px 50px #1f375a1f}
.logo{width:54px;height:54px;display:grid;place-items:center;margin:0 auto 18px;border-radius:16px;background:#2563eb;color:white;font-size:26px;font-weight:bold}
h1{text-align:center;margin:0;font-size:25px}.sub{text-align:center;color:#6b7280;font-size:14px;margin:10px 0 28px}
.group{margin-bottom:18px}label{display:block;margin-bottom:8px;font-size:14px;font-weight:600}
input[type=text],input[type=password]{width:100%;height:46px;padding:0 13px;border:1px solid #d5dce7;border-radius:9px;outline:none;font-size:15px}
input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb1f}
.options{display:flex;justify-content:space-between;align-items:center;margin:2px 0 22px;font-size:13px;color:#6b7280}
.remember{display:flex;align-items:center;gap:7px;font-weight:normal}.remember input{accent-color:#2563eb}
a{color:#2563eb;text-decoration:none}a:hover{text-decoration:underline}
button{width:100%;height:46px;border:0;border-radius:9px;background:#2563eb;color:white;font-size:16px;font-weight:600;cursor:pointer}
button:hover{background:#1d4ed8}.message{display:none;margin-top:16px;padding:11px 12px;border-radius:8px;font-size:13px;line-height:1.5}
.message.error{display:block;color:#b91c1c;background:#fef2f2}.message.success{display:block;color:#166534;background:#f0fdf4}
footer{text-align:center;color:#9ca3af;font-size:12px;margin-top:24px}
@media(max-width:420px){.card{padding:30px 22px}}
</style>
</head>
<body>
<main class="card">
  <div class="logo" aria-hidden="true">L</div>
  <h1>欢迎登录</h1>
  <p class="sub">请输入账号和密码以继续</p>
  <form id="loginForm">
    <div class="group">
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" placeholder="请输入用户名" autocomplete="username" required>
    </div>
    <div class="group">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
    </div>
    <div class="options">
      <label class="remember"><input type="checkbox" id="remember">记住我</label>
      <a href="#" id="helpLink">忘记密码？</a>
    </div>
    <button type="submit">登 录</button>
    <div id="message" class="message" role="status" aria-live="polite"></div>
  </form>
  <footer>© 2026 用户登录系统</footer>
</main>
<script>
const form = document.getElementById("loginForm");
const message = document.getElementById("message");
form.addEventListener("submit", function(event) {
  event.preventDefault();
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  message.className = "message";
  if (!username || !password) {
    message.textContent = "请输入用户名和密码。";
    message.classList.add("error");
    return;
  }
  message.textContent = "表单填写成功！当前仅为前端演示，尚未连接服务器进行身份验证。";
  message.classList.add("success");
});
document.getElementById("helpLink").addEventListener("click", function(event) {
  event.preventDefault();
  message.textContent = "请联系系统管理员重置密码。";
  message.className = "message error";
});
</script>
</body>
</html>
